name: OpenSSF Scorecard

# Nota pública de boas práticas de segurança do repositório (badge no README).
# Só funciona em repositório público.
on:
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 2" # terças, 05:29 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # enviar o SARIF ao Code scanning
      id-token: write # publicar o resultado no OpenSSF (necessário para o badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
